[project]
name = "mcp-vet"
version = "0.2.0"
description = "Trust-scan gate for MCP servers: evidence-backed verdicts (SAFE/REVIEW/DO_NOT_INSTALL) before you install"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "security", "scanning", "trust", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["fastmcp>=2.0"]

[project.scripts]
mcp-vet = "mcp_vet.cli:main"
mcp-vet-server = "mcp_vet.server:main"

[project.urls]
Repository = "https://github.com/ElDiegolar/mcp-vet"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
